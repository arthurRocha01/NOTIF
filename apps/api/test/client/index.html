<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Teste FCM Web</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      #token-box {
        background: #f4f4f4;
        padding: 10px;
        word-wrap: break-word;
        margin-top: 10px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h2>Teste de Notificação FCM</h2>
    <button id="btn-permissao">1. Pedir Permissão e Gerar Token</button>

    <div id="token-box">
      <strong>Seu Token (copie e cole no seu backend):</strong><br />
      <span id="token-texto">Aguardando...</span>
    </div>

    <script type="module">
      // Importando o SDK modular do Firebase (v10)
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import {
        getMessaging,
        getToken,
        onMessage,
      } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-messaging.js";

      // COLOQUE SUAS CREDENCIAIS AQUI (Pegue no Console do Firebase > Configurações do Projeto)
      const firebaseConfig = {
        apiKey: "AIzaSyCkWV-0nFVZR3J3zMxwBnzVab3WWB-FLZU",
        authDomain: "notif-72c72.firebaseapp.com",
        projectId: "notif-72c72",
        storageBucket: "notif-72c72.firebasestorage.app",
        messagingSenderId: "25867044109",
        appId: "1:25867044109:web:ac4f52a0a6f1587fd89c44",
        measurementId: "G-ZMHQJ91ENM",
      };

      // A Chave VAPID fica na aba "Cloud Messaging" > "Configuração da Web"
      const vapidKey =
        "BOcDeGoSA4d2YcuUxy72y200lq3v_BBAGf_UKE0RsrqmZX2LgkdpSiDVll66XIieTAExd2FGAjBQjg1l81N-arI";

      const app = initializeApp(firebaseConfig);
      const messaging = getMessaging(app);

      document
        .getElementById("btn-permissao")
        .addEventListener("click", async () => {
          try {
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
              console.log("Permissão concedida!");
              document.getElementById("token-texto").innerText =
                "Gerando token...";

              // É assim que o navegador "puxa" o arquivo para rodar em segundo plano
              const swRegistration = await navigator.serviceWorker.register(
                "/firebase-messaging-sw.js"
              );

              console.log(
                "Service Worker registrado com sucesso:",
                swRegistration
              );

              const token = await getToken(messaging, {
                vapidKey: vapidKey,
                serviceWorkerRegistration: swRegistration,
              });

              if (token) {
                document.getElementById("token-texto").innerText = token;
                console.log("Token FCM:", token);
              } else {
                document.getElementById("token-texto").innerText =
                  "Nenhum token disponível.";
              }
            } else {
              alert("Você bloqueou as notificações do navegador!");
            }
          } catch (err) {
            console.error("Erro ao gerar token:", err);
            document.getElementById("token-texto").innerText =
              "Erro: Olhe o console (F12)";
          }
        });

      // Escuta mensagens quando a aba ESTÁ ABERTA (Foreground)
      onMessage(messaging, (payload) => {
        console.log("Mensagem recebida no foreground: ", payload);
        alert(
          `🔔 Notificação na Aba Ativa!\nTítulo: ${payload.notification.title}\nCorpo: ${payload.notification.body}`
        );
      });
    </script>
  </body>
</html>
