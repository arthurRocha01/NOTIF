name: notif_app
description: Sistema corporativo de alertas e compliance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
   
  file_picker: ^8.0.0
  google_fonts: ^6.2.1
  fl_chart: ^1.1.1
  lucide_icons_flutter: ^3.1.20
  flutter_riverpod: ^2.5.1
  go_router: ^17.1.0
  intl: ^0.20.2
  http: ^1.6.0

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  audioplayers: ^6.0.0

  shared_preferences: ^2.2.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/notifSound.mp3